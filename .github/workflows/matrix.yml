
name: Multi Environment Matrix Testing

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  compatibility-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']

    runs-on: ${{ matrix.os }}

    steps:
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Display environment details
        shell: python
        run: |
          import platform
          import sys

          print("Operating System:", platform.system())
          print("Python Version:", sys.version)
          print("Matrix testing completed successfully")
