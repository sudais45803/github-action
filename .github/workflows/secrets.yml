
name: Variables and Secrets Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  configuration-check:
    runs-on: ubuntu-latest

    steps:
      - name: Display application configuration
        run: |
          echo "Application: $APP_NAME"
          echo "Configuration loaded successfully"
        env:
          APP_NAME: ${{ vars.APP_NAME }}

      - name: Check secret availability
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}
        run: |
          if [ -n "$MY_SECRET" ]; then
            echo "Secret is configured and available"
          else
            echo "Secret is missing"
            exit 1
          fi

      - name: Confirm completion
        run: echo "Configuration checks completed"
