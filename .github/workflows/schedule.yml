
name: Scheduled Repository Check

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  scheduled-check:
    runs-on: ubuntu-latest

    steps:
      - name: Display scheduled check
        run: |
          echo "Scheduled workflow is running"
          echo "Current UTC time: $(date -u)"
          echo "Repository: ${{ github.repository }}"

      - name: Finish check
        run: echo "Scheduled check completed successfully"
